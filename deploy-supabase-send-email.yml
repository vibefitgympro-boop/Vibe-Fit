name: Deploy Supabase Send Email Auth Hook

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/send-email/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-send-email.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Deploy send-email function
        run: supabase functions deploy send-email --project-ref "$SUPABASE_PROJECT_ID"
